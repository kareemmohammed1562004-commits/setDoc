<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صفحة الأدمن</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main><h1>صفحة الأدمن</h1><div id="app"><div class="msg">جاري التحميل…</div></div></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,collection,onSnapshot,setDoc,deleteDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {firebaseConfig} from "./firebase-config.js";

const app=document.getElementById("app");
const esc=s=>{const d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML};
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
let Q=[],judges={},unsubs=[],db,auth,denied=false;

initializeApp(firebaseConfig);auth=getAuth();db=getFirestore();

function loginView(msg){
  app.innerHTML='<div class="card"><h2>🔒 تسجيل دخول الأدمن</h2><label>الإيميل</label><input id="em" type="email" autocomplete="username"><label>الرقم السري</label><input id="pw" type="password" autocomplete="current-password"><div class="row"><button id="go">دخول</button></div><div class="err">'+esc(msg||"")+'</div></div>';
  const go=async()=>{
    try{await signInWithEmailAndPassword(auth,document.getElementById("em").value.trim(),document.getElementById("pw").value)}
    catch(e){loginView("الإيميل أو الرقم السري غير صحيح")}
  };
  document.getElementById("go").onclick=go;
  document.getElementById("pw").onkeydown=e=>{if(e.key==="Enter")go()};
}

function stop(){unsubs.forEach(u=>u());unsubs=[]}
function start(){
  stop();denied=false;
  unsubs.push(onSnapshot(doc(db,"config","main"),s=>{const d=s.data();Q=d&&d.questions?d.questions:[];if(!typing())shell()}));
  unsubs.push(onSnapshot(collection(db,"judges"),sn=>{judges={};sn.docs.forEach(d=>judges[d.id]=d.data());if(!typing())shell()},
    ()=>{denied=true;stop();signOut(auth)}));
}
const typing=()=>document.activeElement&&document.activeElement.tagName==="INPUT";

function shell(){
  const ids=Object.keys(judges);
  const nm=id=>{const q=Q.find(x=>x.id===id);return q?q.text:"(سؤال محذوف)"};
  app.innerHTML='<div class="row" style="margin:0 0 12px"><button class="s" data-a="out">تسجيل الخروج</button></div>'
  +'<div class="card"><h2>أسئلة الاستبيان</h2>'+Q.map((q,i)=>'<div class="row"><input data-i="'+i+'" value="'+esc(q.text)+'" style="flex:1"><button class="d" data-a="qdel" data-i="'+i+'">حذف</button></div>').join("")
  +'<div class="row"><button class="s" data-a="qadd">إضافة سؤال</button><button data-a="qsave">حفظ الأسئلة</button></div></div>'
  +'<h2>تعديلات المحكمين ('+ids.length+')</h2>'
  +(ids.map(u=>{
    const j=judges[u],del=j.deleted||[],add=j.added||[];
    const rp=add.filter(a=>a.replaces),ad=add.filter(a=>!a.replaces),dl=del.filter(d=>!add.some(a=>a.replaces===d));
    return '<div class="card"><b>'+esc(j.name||"بدون اسم")+'</b>'
    +(!del.length&&!add.length?'<div class="mu">لم يعدّل شيئا</div>':"")
    +rp.map(a=>'<div class="mu">✏️ استبدل «'+esc(nm(a.replaces))+'» بـ «'+esc(a.text)+'»</div>').join("")
    +dl.map(d=>'<div class="mu">🗑️ حذف «'+esc(nm(d))+'»</div>').join("")
    +ad.map(a=>'<div class="mu">➕ أضاف «'+esc(a.text)+'»</div>').join("")
    +'<div class="row"><button class="d" data-a="reset" data-id="'+u+'">مسح تعديلاته</button></div></div>'}).join("")||'<div class="msg">لا توجد تعديلات بعد</div>');
}
const readQ=()=>Q.map((q,i)=>{const el=app.querySelector('input[data-i="'+i+'"]');return {id:q.id,text:el?el.value:q.text}});
app.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b||!b.dataset.a)return;
  const a=b.dataset.a;
  if(a==="out"){stop();signOut(auth)}
  else if(a==="qadd"){Q=readQ().concat({id:newId(),text:"سؤال جديد"});shell()}
  else if(a==="qdel"){Q=readQ();Q.splice(+b.dataset.i,1);shell()}
  else if(a==="qsave"){
    try{await setDoc(doc(db,"config","main"),{questions:readQ().filter(q=>q.text.trim())});alert("تم الحفظ")}catch(x){alert("تعذر الحفظ")}
  }
  else if(a==="reset"){if(confirm("مسح كل تعديلات هذا المحكم؟"))try{await deleteDoc(doc(db,"judges",b.dataset.id))}catch(x){alert("تعذر المسح")}}
});

onAuthStateChanged(auth,u=>{
  if(u&&!u.isAnonymous){start()}
  else{stop();loginView(denied?"هذا الحساب ليس حساب الأدمن":"")}
});
</script>
</body>
</html>
