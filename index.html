<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صفحة المحكمين</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main><h1>صفحة المحكمين</h1><div id="app"><div class="msg">جاري التحميل…</div></div></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,onSnapshot,setDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {firebaseConfig} from "./firebase-config.js";

const DEF=[{id:"q1",text:"السؤال الأول"},{id:"q2",text:"السؤال الثاني"}];
let Q=DEF,J={name:"",deleted:[],added:[]},uid=null,eq=null,db;
const app=document.getElementById("app");
const esc=s=>{const d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML};
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const norm=j=>({name:(j&&j.name)||"",deleted:(j&&j.deleted)||[],added:(j&&j.added)||[]});
const eff=()=>Q.filter(q=>!J.deleted.includes(q.id)).concat(J.added);

function render(){
  if(document.activeElement&&document.activeElement.tagName==="INPUT")return;
  const E=eff();
  app.innerHTML='<div class="card"><label>اسمك</label><input id="name" value="'+esc(J.name)+'"></div>'
  +'<div class="card"><h2>الأسئلة ('+E.length+')</h2>'
  +(E.map(q=>eq===q.id
    ?'<div class="qr"><input id="ein" value="'+esc(q.text)+'"><button data-a="save" data-id="'+q.id+'">حفظ</button><button class="s" data-a="cancel">إلغاء</button></div>'
    :'<div class="qr"><span>'+esc(q.text)+'</span><button class="s" data-a="edit" data-id="'+q.id+'">تعديل</button><button class="d" data-a="del" data-id="'+q.id+'">حذف</button></div>').join("")||'<div class="msg">لا توجد أسئلة</div>')
  +'<div class="row"><input id="nin" placeholder="سؤال جديد" style="flex:1"><button data-a="add">إضافة</button></div></div>';
}
async function persist(n){
  const name=document.getElementById("name").value.trim();
  if(!name){alert("اكتب اسمك أولا");return false}
  try{await setDoc(doc(db,"judges",uid),{name,deleted:n.deleted,added:n.added});return true}
  catch(e){alert("تعذر الحفظ، حاول مرة أخرى");return false}
}
const cp=()=>({deleted:[...J.deleted],added:J.added.map(a=>({...a}))});

app.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  const a=b.dataset.a,id=b.dataset.id,n=cp();
  if(a==="edit"){eq=id;document.activeElement.blur();render()}
  else if(a==="cancel"){eq=null;document.activeElement.blur();render()}
  else if(a==="add"){const t=document.getElementById("nin").value.trim();if(!t)return;n.added.push({id:newId(),text:t});await persist(n);document.activeElement.blur()}
  else if(a==="del"){const i=n.added.findIndex(x=>x.id===id);if(i>=0)n.added.splice(i,1);else n.deleted.push(id);await persist(n)}
  else if(a==="save"){
    const t=document.getElementById("ein").value.trim();if(!t)return;
    const x=n.added.find(y=>y.id===id);
    if(x)x.text=t;else{n.deleted.push(id);n.added.push({id:newId(),text:t,replaces:id})}
    if(await persist(n)){eq=null;document.activeElement.blur();render()}
  }
});

try{
  initializeApp(firebaseConfig);
  const auth=getAuth();db=getFirestore();
  const cred=await signInAnonymously(auth);uid=cred.user.uid;
  onSnapshot(doc(db,"config","main"),s=>{const d=s.data();Q=d&&d.questions&&d.questions.length?d.questions:DEF;render()});
  onSnapshot(doc(db,"judges",uid),s=>{J=norm(s.data());render()});
}catch(e){app.innerHTML='<div class="msg">تعذر الاتصال. تأكد من إعداد Firebase.</div>';console.error(e)}
</script>
</body>
</html>
